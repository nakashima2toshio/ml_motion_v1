name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- ブロッキング: lint + compile + 単体テスト ----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 単体テストは依存ゼロ層のみ（重い依存 torch/cv2/ultralytics/supervision/mlflow/anthropic は
      # 遅延 import のため不要）。backend/tests は FastAPI の TestClient を使うため
      # fastapi + httpx を足す（いずれも純 Python ホイールで軽い）。
      # ⚠️ python-multipart は必須。UploadFile を使うルート（/api/analyze/upload）は
      # **import 時**に例外を投げるため、無いと backend/tests 全体が収集エラーになる。
      # ⚠️ ruff はバージョン固定。未固定だと ruff 側の既定ルール追加（0.16 で RUF022 /
      # PLR1730 / EXE001 / N999 等が既定入り）でコード無変更のまま CI が赤くなる。
      # 更新は「上げる → 出た指摘を直す」を 1 つの PR で行う。
      - run: pip install ruff==0.15.8 pytest pyyaml fastapi httpx python-multipart
      - name: Ruff lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q pipeline app backend scripts tests main.py
      - name: Unit tests
        run: pytest tests/ backend/tests/ -q

  # ---- ブロッキング: フロントエンド（型チェック + テスト + ビルド） ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type check
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # ---- build + frontend 成功後、claude/* ブランチの PR を master へ自動マージ ----
  auto-merge:
    needs: [build, frontend]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ready & merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch=false
